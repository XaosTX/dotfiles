# group|default|options (comma-separated; each is variants/<group>/<option>/)|description
prompt|starship|starship,powerlevel9k,prezto|Prompt. powerlevel9k needs zsh-plugins=oh-my-zsh.
zsh-plugins|zinit|zinit,oh-my-zsh,prezto|Zsh plugin framework. zinit is xaostx's; oh-my-zsh is codeangler's.
vim|plug|plug,submodule|Vim config. plug is vendored (works offline); submodule is XaosTX/dotvim (needs SSH access).
tmux|oh-my-tmux|oh-my-tmux,codeangler|tmux config. oh-my-tmux is xaostx's; codeangler is the standalone file.
git-identity|xaostx|xaostx,codeangler,none|Name, email and signing key in ~/.gitconfig.
git-extras|codeangler|codeangler,none|Extra git settings from codeangler (whitespace, CRLF, aliases, url shortcuts).
gitignore|combined|combined,codeangler,xaostx|Global git ignore list. combined = both lists merged.
ls-aliases|xaostx|xaostx,codeangler|ls, ll and related aliases.
editor|vim|vim,codeangler|EDITOR and vi/vim aliases.
gr-alias|git-remote|git-remote,grafanactl|What the alias 'gr' means. Both tools want it.
alacritty|toml|toml,yml|Alacritty config format (yml is the legacy format).
gitui|default|default,vim|gitui key bindings (vim = vim-style keys).
secrets|local|local,macos-keychain|Where work secrets (Jira user, ops path) are kept. macos-keychain needs macOS.
